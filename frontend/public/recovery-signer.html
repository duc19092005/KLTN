<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital OS - Emergency Restore Signer</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --primary: #06b6d4;
            --primary-hover: #0891b2;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(6, 182, 212, 0.2);
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.8) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 2rem;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0b0f19;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            text-align: center;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 0.5rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        textarea {
            width: 100%;
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-main);
            font-family: monospace;
            font-size: 0.875rem;
            box-sizing: border-box;
            resize: none;
            transition: all 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: #0b0f19;
            border: none;
            border-radius: 8px;
            padding: 0.85rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 1rem;
        }

        .btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .status {
            font-size: 0.875rem;
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            display: none;
            line-height: 1.4;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--error);
            display: block;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--success);
            display: block;
        }

        .wallet-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.875rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 1.5rem;
        }

        .wallet-address {
            font-family: monospace;
            color: var(--primary);
            font-weight: 600;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .copy-btn:hover {
            background: var(--primary);
            color: #0b0f19;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo-area">
            <div class="logo-icon">➕</div>
            <h1>Hospital OS Emergency Signer</h1>
        </div>
        <p class="description">
            Công cụ ký số cứu hộ ngoại băng dành cho Admin. Không yêu cầu kết nối internet. Quá trình ký diễn ra hoàn toàn bảo mật trong ví MetaMask của bạn.
        </p>

        <div class="wallet-info" id="wallet-section">
            <span>Ví kết nối:</span>
            <span class="wallet-address" id="wallet-addr">Chưa kết nối</span>
        </div>

        <div class="form-group">
            <label for="challenge-input">1. Dán chuỗi Challenge cứu hộ từ Terminal:</label>
            <textarea id="challenge-input" rows="3" placeholder="Dán chuỗi dạng EMERGENCY_DATABASE_RESTORE_CHALLENGE:..."></textarea>
        </div>

        <button class="btn" id="action-btn" onclick="handleWalletAction()">
            🔌 Kết nối ví MetaMask
        </button>

        <div class="form-group" id="signature-group" style="margin-top: 2rem; display: none;">
            <label for="signature-output">3. Sao chép Chữ ký số tạo được:</label>
            <textarea id="signature-output" rows="4" readonly placeholder="Chữ ký số dạng Hex sẽ xuất hiện ở đây..."></textarea>
            <button class="copy-btn" id="copy-btn" onclick="copySignature()">📋 Sao chép chữ ký</button>
        </div>

        <div class="status" id="status-box"></div>
    </div>
</div>

<script>
    let connectedAddress = '';

    const actionBtn = document.getElementById('action-btn');
    const walletAddr = document.getElementById('wallet-addr');
    const challengeInput = document.getElementById('challenge-input');
    const signatureGroup = document.getElementById('signature-group');
    const signatureOutput = document.getElementById('signature-output');
    const statusBox = document.getElementById('status-box');

    // Display error messages
    function showError(msg) {
        statusBox.className = 'status error';
        statusBox.innerText = msg;
    }

    // Display success messages
    function showSuccess(msg) {
        statusBox.className = 'status success';
        statusBox.innerText = msg;
    }

    function clearStatus() {
        statusBox.style.display = 'none';
    }

    // Handle MetaMask connection and signing
    async function handleWalletAction() {
        clearStatus();

        if (typeof window.ethereum === 'undefined') {
            showError('❌ Không tìm thấy ví MetaMask. Vui lòng cài đặt tiện ích MetaMask trên trình duyệt!');
            return;
        }

        try {
            if (!connectedAddress) {
                // Step 1: Connect Wallet
                actionBtn.disabled = true;
                actionBtn.innerText = '⏳ Đang kết nối ví...';
                
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                connectedAddress = accounts[0];
                
                walletAddr.innerText = connectedAddress.substring(0, 6) + '...' + connectedAddress.substring(connectedAddress.length - 4);
                actionBtn.innerText = '✍️ Ký thông điệp cứu hộ';
                actionBtn.disabled = false;
                showSuccess('✅ Đã kết nối thành công với ví MetaMask của bạn.');
            } else {
                // Step 2: Sign Challenge
                const challenge = challengeInput.value.trim();
                if (!challenge) {
                    showError('❌ Vui lòng dán chuỗi Challenge lấy từ terminal máy chủ trước khi ký!');
                    return;
                }

                actionBtn.disabled = true;
                actionBtn.innerText = '⏳ Đang chờ bạn xác nhận trên MetaMask...';

                // Call MetaMask personal_sign method (UTF-8 plain text sign)
                const signature = await window.ethereum.request({
                    method: 'personal_sign',
                    params: [challenge, connectedAddress]
                });

                signatureOutput.value = signature;
                signatureGroup.style.display = 'block';
                actionBtn.innerText = '✍️ Ký lại thông điệp';
                actionBtn.disabled = false;
                
                showSuccess('🎉 Đã tạo chữ ký thành công! Hãy copy chuỗi chữ ký số bên dưới dán vào Terminal cứu hộ.');
            }
        } catch (err) {
            console.error(err);
            actionBtn.disabled = false;
            actionBtn.innerText = connectedAddress ? '✍️ Ký thông điệp cứu hộ' : '🔌 Kết nối ví MetaMask';
            showError('❌ Lỗi: ' + (err.message || 'Yêu cầu bị từ chối hoặc có lỗi xảy ra.'));
        }
    }

    // Copy signature to clipboard
    function copySignature() {
        signatureOutput.select();
        document.execCommand('copy');
        
        const copyBtn = document.getElementById('copy-btn');
        copyBtn.innerText = '✅ Đã sao chép!';
        setTimeout(() => {
            copyBtn.innerText = '📋 Sao chép chữ ký';
        }, 2000);
    }
</script>
</body>
</html>
