name: kltn-tamper-recovery-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kltn_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kltn_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka-test:
    image: bitnamilegacy/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-test:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka-test:9092,EXTERNAL://localhost:9095
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9095:9095"
    volumes:
      - kafka_test_data:/bitnami/kafka
    restart: unless-stopped

  ipfs-test:
    image: ipfs/kubo:v0.29.0
    ports:
      - "4002:4001"
      - "5002:5001"
      - "8082:8080"
    volumes:
      - ipfs_test_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  hardhat-test:
    build:
      context: ./blockchain
    command: ["npm", "run", "node"]
    ports:
      - "8545:8545"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_test_data:
  kafka_test_data:
  ipfs_test_data:
