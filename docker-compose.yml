services:
  db:
    image: postgres:16-alpine
    container_name: admin-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-zkp_identity}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  blockchain:
    build:
      context: ./blockchain
    container_name: admin-auth-blockchain
    restart: unless-stopped
    ports:
      - "8545:8545"

  backend:
    build:
      context: ./backend
    container_name: admin-auth-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-zkp_identity}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      SUPER_ADMIN_PRIVATE_KEY: ${SUPER_ADMIN_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      IDENTITY_REGISTRY_ADDRESS: ${IDENTITY_REGISTRY_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      DEPARTMENT_REGISTRY_ADDRESS: ${DEPARTMENT_REGISTRY_ADDRESS:-0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512}
      FACE_REGISTRY_ADDRESS: ${FACE_REGISTRY_ADDRESS:-0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0}
      AUDIT_ANCHOR_ADDRESS: ${AUDIT_ANCHOR_ADDRESS:-0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9}
      STAFF_REGISTRY_ADDRESS: ${STAFF_REGISTRY_ADDRESS:-0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9}
      AI_MODEL_REGISTRY_ADDRESS: ${AI_MODEL_REGISTRY_ADDRESS:-0x5FC8d32690cc91D4c39d9d3abcBD16989F875707}
      AUDIT_PEPPER: ${AUDIT_PEPPER:-}
      BLOCKCHAIN_RPC_URL: http://blockchain:8545
      FRONTEND_ORIGIN: http://localhost:5173
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "until nc -z db 5432; do echo 'Waiting for PostgreSQL...'; sleep 2; done; until nc -z blockchain 8545; do echo 'Waiting for blockchain...'; sleep 2; done; sleep 6; npx prisma generate; npx prisma db push; npm run start:dev"
    depends_on:
      db:
        condition: service_healthy
      blockchain:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001/api
        VITE_IDENTITY_REGISTRY_ADDRESS: ${IDENTITY_REGISTRY_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
        VITE_NETWORK_RPC_URL: http://localhost:8545
        VITE_CHAIN_ID: 31337
    container_name: admin-auth-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001/api
      VITE_IDENTITY_REGISTRY_ADDRESS: ${IDENTITY_REGISTRY_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      VITE_NETWORK_RPC_URL: http://localhost:8545
      VITE_CHAIN_ID: 31337
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend

volumes:
  postgres_data:
