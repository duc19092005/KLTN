services:
  db:
    image: postgres:16-alpine
    container_name: admin-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-zkp_identity}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  blockchain:
    build:
      context: ./blockchain
    container_name: admin-auth-blockchain
    restart: unless-stopped
    ports:
      - "8545:8545"

  backend:
    build:
      context: ./backend
    container_name: admin-auth-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    # Pull every variable from root .env automatically. Adding a new var to
    # .env is then enough — no need to also list it in `environment:` below.
    env_file:
      - ./.env
    # Required-vars guard + docker-network overrides. Anything declared here
    # wins over `env_file` (so DATABASE_URL / BLOCKCHAIN_RPC_URL correctly
    # point at the in-network service names instead of localhost).
    environment:
      # --- required (fail fast if missing) ---
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
      AUDIT_PEPPER: ${AUDIT_PEPPER:?AUDIT_PEPPER must be set in .env}
      # --- docker-network overrides ---
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-zkp_identity}?schema=public
      BLOCKCHAIN_RPC_URL: http://blockchain:8545
      FRONTEND_ORIGIN: http://localhost:5173
      # --- server config ---
      NODE_ENV: development
      PORT: 3001
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "until nc -z db 5432; do echo 'Waiting for PostgreSQL...'; sleep 2; done; until nc -z blockchain 8545; do echo 'Waiting for blockchain...'; sleep 2; done; sleep 6; npx prisma generate; npx prisma db push; npm run start:dev"
    depends_on:
      db:
        condition: service_healthy
      blockchain:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Vite reads VITE_* at build time; pass through .env values.
        VITE_API_URL: http://localhost:3001/api
        VITE_IDENTITY_REGISTRY_ADDRESS: ${IDENTITY_REGISTRY_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
        VITE_NETWORK_RPC_URL: http://localhost:8545
        VITE_CHAIN_ID: 31337
    container_name: admin-auth-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001/api
      VITE_IDENTITY_REGISTRY_ADDRESS: ${IDENTITY_REGISTRY_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      VITE_NETWORK_RPC_URL: http://localhost:8545
      VITE_CHAIN_ID: 31337
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend

volumes:
  postgres_data:
