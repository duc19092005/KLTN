services:
  db:
    image: postgres:16-alpine
    container_name: admin-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourPassword123!
      POSTGRES_DB: zkp_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zkp_identity"]
      interval: 5s
      timeout: 5s
      retries: 20

  blockchain:
    build:
      context: ./blockchain
    container_name: admin-auth-blockchain
    restart: unless-stopped
    ports:
      - "8545:8545"

  backend:
    build:
      context: ./backend
    container_name: admin-auth-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:YourPassword123!@db:5432/zkp_identity?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SUPER_ADMIN_PRIVATE_KEY: ${SUPER_ADMIN_PRIVATE_KEY}
      IDENTITY_REGISTRY_ADDRESS: ${IDENTITY_REGISTRY_ADDRESS}
      BLOCKCHAIN_RPC_URL: http://blockchain:8545
    depends_on:
      db:
        condition: service_healthy
      blockchain:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: admin-auth-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001/api
      VITE_IDENTITY_REGISTRY_ADDRESS: ${IDENTITY_REGISTRY_ADDRESS}
      VITE_NETWORK_RPC_URL: http://localhost:8545
      VITE_CHAIN_ID: 31337
    depends_on:
      - backend

volumes:
  postgres_data:
