services:
  db:
    image: postgres:16-alpine
    container_name: admin-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-zkp_identity}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # bitnami/* free tags were removed from Docker Hub (Aug 2025).
    # Use bitnamilegacy for local/dev (no further updates; same image layout).
    image: bitnamilegacy/kafka:3.7
    container_name: kltn-audit-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build:
      context: ../../apps/hospital-api
    container_name: admin-auth-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    # Backend owns its runtime env. Do not load root, hospital-web, or audit-contracts env here.
    env_file:
      - ../../apps/hospital-api/.env
    # Docker-only overrides. Secrets and app config stay in apps/hospital-api/.env.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-zkp_identity}?schema=public
      FRONTEND_ORIGIN: http://localhost:5173,http://localhost:8081
      NODE_ENV: development
      PORT: 3001
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
      KAFKA_REPLICATION_FACTOR: 1
    volumes:
      - ../../apps/hospital-api:/app
      - /app/node_modules
    command: sh -c "until nc -z db 5432; do echo 'Waiting for PostgreSQL...'; sleep 2; done; sleep 6; npx prisma generate; npx prisma db push; npm run start:dev"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ../../apps/hospital-web
      args:
        VITE_API_URL: http://localhost:3001/api
    container_name: admin-auth-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ../../apps/hospital-web/.env
    environment:
      VITE_API_URL: http://localhost:3001/api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../../apps/hospital-web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend

volumes:
  postgres_data:
  kafka_data:
