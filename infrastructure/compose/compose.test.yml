name: kltn-tamper-recovery-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kltn_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kltn_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped


  ipfs-test:
    image: ipfs/kubo:v0.29.0
    ports:
      - "4002:4001"
      - "5002:5001"
      - "8082:8080"
    volumes:
      - ipfs_test_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  hardhat-test:
    build:
      context: ../../apps/audit-contracts
    command: ["npm", "run", "node"]
    ports:
      - "8545:8545"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_test_data:
  ipfs_test_data:
